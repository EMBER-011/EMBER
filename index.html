const JC={"ㄱㅅ":"ㄳ","ㄴㅈ":"ㄵ","ㄴㅎ":"ㄶ","ㄹㄱ":"ㄺ","ㄹㅁ":"ㄻ","ㄹㅂ":"ㄼ","ㄹㅅ":"ㄽ","ㄹㅌ":"ㄾ","ㄹㅍ":"ㄿ","ㄹㅎ":"ㅀ","ㅂㅅ":"ㅄ"};
const CK={"4":"ㄱㅋㄲ","5":"ㄴㄹ","6":"ㄷㅌㄸ","7":"ㅂㅍㅃ","8":"ㅅㅎㅆ","9":"ㅈㅊㅉ","0":"ㅇㅁ"},VK={"1":"ㅣ","2":"ㆍ","3":"ㅡ"};
const VT={"ㅣ":{"ㆍ":"ㅏ"},"ㅏ":{"ㆍ":"ㅑ","ㅣ":"ㅐ"},"ㅑ":{"ㅣ":"ㅒ"},"ㆍ":{"ㅣ":"ㅓ","ㆍ":"ᆢ","ㅡ":"ㅗ"},"ᆢ":{"ㅣ":"ㅕ","ㅡ":"ㅛ"},"ㅓ":{"ㅣ":"ㅔ"},"ㅕ":{"ㅣ":"ㅖ"},"ㅗ":{"ㅣ":"ㅚ"},"ㅚ":{"ㆍ":"ㅘ"},"ㅘ":{"ㅣ":"ㅙ"},"ㅡ":{"ㆍ":"ㅜ","ㅣ":"ㅢ"},"ㅜ":{"ㆍ":"ㅠ","ㅣ":"ㅟ"},"ㅠ":{"ㅣ":"ㅝ"},"ㅝ":{"ㅣ":"ㅞ"}};
const FINAL=c=>!"ㄸㅃㅉ".includes(c),isV=v=>!!v&&JUNG.includes(v);
const hg={pre:"",c:null,v:"",j:[],last:null};
function hgReset(){const i=$("#pmsg");hg.pre=i?i.value:"";hg.c=null;hg.v="";hg.j=[];hg.last=null}
function hgComp(){const {c,v,j}=hg;
 if(c&&isV(v)){const jj=j.length===2?JC[j[0]+j[1]]:j[0]||"";return String.fromCharCode(0xAC00+(CHO.indexOf(c)*21+JUNG.indexOf(v))*28+JONG.indexOf(jj))}
 return (c||"")+(v==="ᆢ"?"ㆍㆍ":v)}
function hgShow(){const i=$("#pmsg");if(i)i.value=hg.pre+hgComp()}
function hgCommit(){hg.pre+=hgComp();hg.c=null;hg.v="";hg.j=[];hg.last=null}
function hgKey(d){
 const i=$("#pmsg");if(!i)return;if(i.value!==hg.pre+hgComp())hgReset();
 const now=Date.now(),lt=hg.last;
 if(d==="del"){if(hg.j.length)hg.j.pop();else if(hg.v)hg.v="";else if(hg.c)hg.c=null;else hg.pre=hg.pre.slice(0,-1);hg.last=null;return hgShow()}
 if(d==="#"){hgCommit();hg.pre+=" ";return hgShow()}
 if(d==="*"){hgCommit();hg.pre+=(hg.pre.match(/\(/g)||[]).length>(hg.pre.match(/\)/g)||[]).length?")":"(";return hgShow()}
 if(VK[d]){const k=VK[d];hg.last=null;
  if(hg.j.length){const mv=hg.j.pop();hgCommit();hg.c=mv;hg.v=k;return hgShow()}
  if(hg.v){const n=(VT[hg.v]||{})[k];if(n){hg.v=n;return hgShow()}hgCommit();hg.v=k;return hgShow()}
  hg.v=k;return hgShow()}
 const L=CK[d];if(!L)return;
 if(lt&&lt.d===d&&now-lt.t<1000){
  if(lt.s==="c"){const n=L[(L.indexOf(hg.c)+1)%L.length],sp=lt.sp;
   if(sp&&!hg.v&&(sp.j.length===0?FINAL(n):sp.j.length===1&&!!JC[sp.j[0]+n])){hg.pre=hg.pre.slice(0,-1);hg.c=sp.c;hg.v=sp.v;hg.j=sp.j.length?[sp.j[0],n]:[n];hg.last={d,s:"j",t:now};return hgShow()}
   hg.c=n;hg.last={d,s:"c",t:now,sp};return hgShow()}
  const j0=hg.j.length===2?hg.j[0]:null,n=L[(L.indexOf(hg.j[hg.j.length-1])+1)%L.length];
  if(j0?!!JC[j0+n]:FINAL(n)){hg.j[hg.j.length-1]=n;hg.last={d,s:"j",t:now};return hgShow()}
  hg.j.pop();const sp={c:hg.c,v:hg.v,j:[...hg.j]};hgCommit();hg.c=n;hg.last={d,s:"c",t:now,sp};return hgShow()}
 const c=L[0];
 if(hg.c&&isV(hg.v)){
  if(!hg.j.length&&FINAL(c)){hg.j=[c];hg.last={d,s:"j",t:now};return hgShow()}
  if(hg.j.length===1&&JC[hg.j[0]+c]){hg.j.push(c);hg.last={d,s:"j",t:now};return hgShow()}
  const sp={c:hg.c,v:hg.v,j:[...hg.j]};hgCommit();hg.c=c;hg.last={d,s:"c",t:now,sp};return hgShow()}
 hgCommit();hg.c=c;hg.last={d,s:"c",t:now};hgShow()}
function hgInsert(ch){const i=$("#pmsg");if(!i)return;if(i.value!==hg.pre+hgComp())hgReset();hgCommit();hg.pre+=ch;hgShow()}

/* ===== 초기화 ===== */
function bsub(){const k=me&&me.party?me.party:null;if(k===bk)return;if(bunsub){bunsub();bunsub=null}bk=k;battle=null;if(!k)return;
 bunsub=db.doc("battles/"+k).onSnapshot(s=>{battle=s.exists?s.data():null;settleCheck();if(tab==="battle")rq()},e=>note("파티 전투 연결 오류: "+errT(e)))}
let sy;function syncSoon(){clearTimeout(sy);sy=setTimeout(()=>{if(!me||!ld.g||!ld.p)return;const p={};
 if(me.guild){const g=guilds[me.guild];if(!g||!g.members.includes(uid))p.guild=null}
 if(me.party){const q=parties[me.party];if(!q||!q.members.includes(uid))p.party=null}
 if(Object.keys(p).length)db.doc("chars/"+uid).update(p)},2500)}

(async()=>{await window.__fbReady;
 const t=setTimeout(()=>{if(!db)note("연결이 지연됩니다. 인터넷 연결을 확인하세요.")},10000);let user;
 try{if(window.claude){db=await claude.use("db");user=await claude.use("user")}}catch(e){}
 clearTimeout(t);
 if(!db||!user){db=null;$("#view").textContent="";$("#view").append(h("p",{c:"mt",t:"서버에 연결하지 못했습니다. 새로고침해 주세요."}));return}
 uid=await user.id();canGM=!!user.canEdit();const er=e=>note("데이터를 불러오지 못했습니다: "+errT(e));
 claude.use("room").then(r=>{if(!r)return;rm=r;try{rm.on("call",onCall,()=>{});rm.onPeers(c=>{online=new Set(c.peers.map(p=>p.by||(p.presence&&p.presence.u)).filter(Boolean));phRefresh();if(tab==="guild"||tab==="map")rq()},()=>{});rm.presence({u:uid}).catch(()=>{})}catch(e){rm=null}}).catch(()=>{});
 const lst=(path,lim,fn,ids)=>db.collection(path).orderBy("t","desc").limit(lim).onSnapshot(s=>fn(s.docs.map(d=>ids?Object.assign({id:d.id},d.data()):d.data()).reverse()),er);
 db.collection("chars").onSnapshot(s=>{const mine=s.docChanges().some(c=>c.doc.id===uid);chars={};let m0=null;s.docs.forEach(d=>{const x=d.data();if(d.id===uid)m0=x;if(!x.reset)chars[d.id]=x});me=m0&&!m0.reset?m0:null;resetDoc=m0&&m0.reset?m0:null;ld.c=1;
  if(me){if(me.loc!==lastLoc){const first=lastLoc===null;lastLoc=me.loc;selReg=me.loc;mapCont=null;showSpots=false;
    if(phoneOn&&ph.scr==="chat"&&ph.room==="rp")phRender()}
   migrate();if(claimExp!==null&&me.bank===claimExp)claimExp=null;claimPayouts();
   if(pendEnc&&me.loc===pendEnc&&!me.trip){pendEnc=null;encounter().catch(e=>toast("전투 오류: "+errT(e)))}}
  phRefresh();updDot();bsub();settleCheck();syncSoon();if(mine||["guild","battle"].includes(tab)||!me)rq()},er);
 db.collection("guilds").onSnapshot(s=>{guilds={};s.docs.forEach(d=>guilds[d.id]=d.data());ld.g=1;syncSoon();phRefresh();if(tab==="guild")rq()},er);
 db.collection("parties").onSnapshot(s=>{parties={};s.docs.forEach(d=>parties[d.id]=d.data());ld.p=1;syncSoon();phRefresh();if(tab==="battle")rq()},er);
 lst("rp",80,a=>{rp=a;onMsg()});lst("gchat",80,a=>{gchat=a;onMsg()});lst("dm",100,a=>{dms=a;onMsg()});lst("gmsg",100,a=>{gmsgs=a;onMsg()});lst("pchat",60,a=>{pchats=a;onMsg()});
 db.collection("groups").onSnapshot(s=>{groups={};s.docs.forEach(d=>groups[d.id]=d.data());onMsg()},er);
 lst("warlog",10,a=>{wars=a.reverse();if(tab==="guild")rq()});
 lst("market",60,a=>{market=a.reverse();if(tab==="map"&&me&&me.loc==="base"&&spot()==="market")rq()},true);

 lst("calls",50,a=>{calls=a;if(phoneOn&&(ph.scr==="dial"||ph.scr==="home"))phRender();updDot()});
 setInterval(()=>{if(!me)return;
  if(me.trip&&Date.now()>=me.trip.at&&!arr){arr=1;const to=me.trip.to;selReg=to;pendEnc=!REG[to].safe&&rf()<encRate(HSP.out.enc)?to:null;(()=>{const pp={loc:to,trip:null,spot:defSpot(to)},gd=REG[to].safe?null:maybeDrop(.04+tier(REG[to].lv)*.01,REG[to].lv),got=addGear(pp,gd);return upd(pp).then(()=>{if(got)toastG(gd)})})().catch(e=>toast("도착 처리 실패: "+errT(e))).finally(()=>arr=0)}
  updTop();const now=Date.now();const pc=$("#pclock");if(pc){pc.textContent=clock();const pb=$("#pbig");if(pb)pb.textContent=clock()}
  document.querySelectorAll("[data-u]").forEach(e=>e.textContent=fmt(Math.max(0,Math.ceil((+e.dataset.u-now)/1000))));
  const td=$("#tdot");if(td&&me.trip){const a=REG[me.trip.from],b=REG[me.trip.to],dur=me.trip.dur||tsec(me.trip.from,me.trip.to)*1000,f=Math.max(0,Math.min(1,1-(me.trip.at-now)/dur));td.setAttribute("cx",a.x+(b.x-a.x)*f);td.setAttribute("cy",a.y+(b.y-a.y)*f)}
  if(battle&&battle.st==="on"&&battle.mem&&battle.mem[uid]&&battle.mon.nextAt<=now&&!mt){mt=1;bmut(monTick).finally(()=>mt=0)}
  if(phoneOn&&ph.scr==="incall"&&call.st!=="idle")updCall();
 },1000);
 setInterval(()=>{const now=Date.now(),m=inB()?battle.mem[uid]:null,mp=m?memMp(m):0;
  document.querySelectorAll("[data-sk]").forEach(e=>{const r=Math.max(0,(cds[e.dataset.sk]||0)-now),tot=+e.dataset.cd||1;e.disabled=r>0||e.dataset.dead==="1"||mp<+e.dataset.mp;e.querySelector(".fill").style.height=Math.min(100,r/tot*100)+"%";e.querySelector(".cdt").textContent=r>0?(r/1000).toFixed(1)+"초":mp<+e.dataset.mp?"MP 부족":"준비"});
  const bm=$("#bmp");if(bm&&m){bm.querySelector("i").style.width=Math.min(100,mp/m.mpMax*100)+"%";bm.querySelector("span").textContent="MP "+Math.floor(mp)+" / "+m.mpMax}
  const nx=$("#nxt");if(nx&&battle&&battle.mon){const r=Math.max(0,battle.mon.nextAt-now);nx.textContent=(r/1000).toFixed(1)+"초";const nb=$("#nxb");if(nb)nb.style.width=Math.min(100,(1-r/4500)*100)+"%"}
 },200);
})();
