#tgl:active:not(:disabled){transform:translateX(-50%)}#tgl svg{width:16px;height:16px;fill:none;stroke:var(--ac2);stroke-width:2;transition:transform .2s}#top.min #tgl svg{transform:rotate(180deg)}

.av.l{width:76px;height:76px;font-size:28px}.av.s{width:28px;height:28px;font-size:12px}

.stat button{width:38px;padding:6px 0}
.mapw{border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:8px}
.holow{position:relative}.holow canvas.holo{display:block;width:100%;height:min(44vh,400px);min-height:250px;touch-action:none;cursor:grab}
.hmt{position:absolute;right:8px;top:8px;display:flex;gap:5px;z-index:2}.hmb{display:flex;align-items:center;justify-content:center;min-width:30px;height:28px;padding:0 8px;font-size:11px;font-weight:500;letter-spacing:.04em;border-radius:3px;border:1px solid rgba(var(--acr),.55);background:rgba(var(--acr),.08);color:var(--ac);box-shadow:0 0 8px rgba(var(--acr),.25) inset}.hmb svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6}
.mapw .ms{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}.map{display:block;height:min(86vw,40vh);width:auto;max-width:none}
.nd{cursor:pointer}
.legend{display:flex;gap:4px 10px;flex-wrap:wrap;padding:8px 12px;background:var(--sf);border-top:1px solid var(--ln);font-size:11px;color:var(--mt)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.h0{font-size:18px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px;text-align:left;font-weight:400}.tile b{display:block}
button.tile:hover{background:rgba(var(--acr),.1)}
.feed{flex:1;overflow-y:auto;padding:2px 0}
.m{display:flex;gap:8px;margin:0 0 8px;align-items:flex-start}
.m .b{background:var(--sf);border:1px solid var(--bd);border-radius:4px 14px 14px 14px;padding:7px 11px;word-break:break-word;min-width:0}
.m .mc{display:flex;flex-direction:column;min-width:0;max-width:80%}.m.own .mc{align-items:flex-end}.m .nm{font-size:12px;font-weight:700;color:var(--ac2);margin:0 4px 2px}.m.own{flex-direction:row-reverse}.m.own .b{background:rgba(var(--acr),.12);border-radius:14px 4px 14px 14px}
.comp{padding-top:6px;flex:none}

.logbox{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;margin:10px 0;font-size:13px;color:var(--mt);max-height:150px;overflow-y:auto}.logbox div{padding:1px 0}.logbox div:last-child{color:var(--tx);font-weight:600}
.sks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.mem{margin-top:8px}.mem .row{margin-bottom:2px}
#toast{position:fixed;left:0;right:0;margin:0 auto;bottom:100px;width:fit-content;max-width:min(620px,calc(100% - 24px));box-sizing:border-box;background:var(--sf);color:var(--tx);border:1px solid var(--bd);padding:9px 18px;border-radius:2px;font-size:13px;font-weight:500;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;display:none;text-align:center;z-index:12}

/* phone */
#ptab{position:fixed;left:0;top:33%;width:40px;height:66px;padding:0;border-left:0;border-radius:0 12px 12px 0;background:var(--sf);z-index:8;display:none;align-items:center;justify-content:center}
